apiVersion: apps/v1
kind: Deployment
metadata:
  name: lla-backend
  labels:
    app: lla-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lla-backend
  template:
    metadata:
      labels:
        app: lla-backend
    spec:
      containers:
      - name: backend
        image: lla-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: lla-secrets
              key: database-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: lla-backend-service
spec:
  selector:
    app: lla-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer

